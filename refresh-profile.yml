name: Refresh profile

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any required packages here if you expand the generator later
          # pip install matplotlib numpy requests

      - name: Run profile builder (if present)
        run: |
          if [ -f scripts/build_profile.py ]; then
            python scripts/build_profile.py || echo "build_profile.py finished with warnings"
          else
            echo "No build_profile.py found — skipping generation"
          fi

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/ || true
          git diff --staged --quiet || git commit -m "chore: refresh profile assets"
          git push || echo "Nothing new to push"
