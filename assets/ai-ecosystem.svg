<g font-family="Segoe UI,Arial"><g><circle cx="230" cy="155" r="64" fill="#7c3aed"/><text x="230" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Agentic AI</text><text x="230" y="176" text-anchor="middle" font-size="13" fill="#ede9fe">LangGraph · tools</text></g><g><circle cx="400" cy="390" r="64" fill="#f59e0b"/><text x="400" y="385" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ML + Data</text><text x="400" y="411" text-anchor="middle" font-size="13" fill="#fffbeb">prediction · fuzzy</text></g><g><circle cx="600" cy="125" r="64" fill="#14b8a6"/><text x="600" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Vision</text><text x="600" y="146" text-anchor="middle" font-size="13" fill="#ccfbf1">OpenCV · tracking</text></g><g><circle cx="970" cy="155" r="64" fill="#ec4899"/><text x="970" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Product AI</text><text x="970" y="176" text-anchor="middle" font-size="13" fill="#fce7f3">APIs · full-stack</text></g><g><circle cx="800" cy="390" r="64" fill="#2563eb"/><text x="800" y="385" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Physical AI</text><text x="800" y="411" text-anchor="middle" font-size="13" fill="#dbeafe">ROS 2 · edge</text></g><g><circle cx="1030" cy="365" r="64" fill="#64748b"/><text x="1030" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Delivery</text><text x="1030" y="386" text-anchor="middle" font-size="13" fill="#f1f5f9">cloud · CI/CD</text></g></g>
