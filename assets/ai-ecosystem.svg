<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">AmDeep AI engineering ecosystem</title><desc id="desc">A visual map connecting agentic AI, machine learning, computer vision, data, cloud, and physical AI to shipped project evidence.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/><text x="54" y="58" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#f8fafc">AI engineering ecosystem</text><text x="54" y="87" font-family="Segoe UI,Arial" font-size="15" fill="#bfdbfe">From data and models to agents, products, and physical systems</text>
<g stroke="#38bdf8" stroke-width="2" opacity=".65" fill="none"><path d="M600 245 L230 155"/><path d="M600 245 L400 390"/><path d="M600 245 L600 125"/><path d="M600 245 L970 155"/><path d="M600 245 L800 390"/><path d="M600 245 L1030 365"/></g>
