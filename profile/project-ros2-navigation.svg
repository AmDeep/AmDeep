<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">ROS 2 + vLLM Navigation Bridge</title>
  <desc id="svg-description">Semantic planning · bounded control. Turns a mission into structured waypoints for a deterministic local controller. Evidence: Bounded Twist output and replay-focused safety checks.</desc>
  <style>
    .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    .signal{opacity:.85}
    .pulse{opacity:.82}
    .card-accent{opacity:.9}
  </style>
  
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172438"/><stop offset="1" stop-color="#101826"/></linearGradient></defs>
  <rect width="1100" height="220" rx="20" fill="url(#card)" stroke="#2B3B53"/>
  <rect x="0" y="0" width="7" height="220" rx="4" fill="#D69BFF"/>
  <text x="36" y="47" class="mono" font-size="13" fill="#D69BFF" letter-spacing="1">SEMANTIC PLANNING · BOUNDED CONTROL</text>
  <text x="36" y="91" class="sans" font-size="29" font-weight="720" fill="#F3F6FB">ROS 2 + vLLM Navigation Bridge</text>
  <text x="36" y="130" class="sans" font-size="16" fill="#A9B8CC">Turns a mission into structured waypoints for a deterministic local controller.</text>
  <text x="36" y="161" class="sans" font-size="14" fill="#F3F6FB">Bounded Twist output and replay-focused safety checks.</text>
  <text x="36" y="196" class="mono" font-size="12" fill="#8395AD">github.com/AmDeep/ros2-vllm-navigation-bridge</text>
  <circle class="pulse" cx="1044" cy="44" r="8" fill="#D69BFF" opacity=".8"/>

</svg>
