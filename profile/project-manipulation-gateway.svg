<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Manipulation Safety Gateway</title>
  <desc id="svg-description">Typed targets · explicit rejection. A robot-arm planning boundary for validating proposed joint targets. Evidence: Out-of-limit proposals are rejected; actuator limits remain deterministic.</desc>
  <style>
    .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    .signal{opacity:.85}
    .pulse{opacity:.82}
    .card-accent{opacity:.9}
  </style>
  
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172438"/><stop offset="1" stop-color="#101826"/></linearGradient></defs>
  <rect width="1100" height="220" rx="20" fill="url(#card)" stroke="#2B3B53"/>
  <rect x="0" y="0" width="7" height="220" rx="4" fill="#FF8295"/>
  <text x="36" y="47" class="mono" font-size="13" fill="#FF8295" letter-spacing="1">TYPED TARGETS · EXPLICIT REJECTION</text>
  <text x="36" y="91" class="sans" font-size="29" font-weight="720" fill="#F3F6FB">Manipulation Safety Gateway</text>
  <text x="36" y="130" class="sans" font-size="16" fill="#A9B8CC">A robot-arm planning boundary for validating proposed joint targets.</text>
  <text x="36" y="161" class="sans" font-size="14" fill="#F3F6FB">Out-of-limit proposals are rejected; actuator limits remain deterministic.</text>
  <text x="36" y="196" class="mono" font-size="12" fill="#8395AD">github.com/AmDeep/manipulation-vllm-safety-gateway</text>
  <circle class="pulse" cx="1044" cy="44" r="8" fill="#FF8295" opacity=".8"/>

</svg>
