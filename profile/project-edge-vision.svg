<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Edge Vision Inspector</title>
  <desc id="svg-description">Edge capture · offline replay. An inspection pipeline that keeps capture metadata and robot state explicit. Evidence: Semantic interpretation is optional; replay runs without a live model.</desc>
  <style>
    .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    @media (prefers-reduced-motion: no-preference) {
      .signal{animation:signal-travel 5s ease-in-out infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .card-accent{animation:accent-shift 8s ease-in-out infinite}
    }
    @media (prefers-reduced-motion: reduce) {
      .signal,.pulse,.card-accent{animation:none!important}
    }
    @keyframes signal-travel{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(350px);opacity:1}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes accent-shift{0%,100%{opacity:.72}50%{opacity:1}}
  </style>
  
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172438"/><stop offset="1" stop-color="#101826"/></linearGradient></defs>
  <rect width="1100" height="220" rx="20" fill="url(#card)" stroke="#2B3B53"/>
  <rect x="0" y="0" width="7" height="220" rx="4" fill="#FFC857"/>
  <text x="36" y="47" class="mono" font-size="13" fill="#FFC857" letter-spacing="1">EDGE CAPTURE · OFFLINE REPLAY</text>
  <text x="36" y="91" class="sans" font-size="29" font-weight="720" fill="#F3F6FB">Edge Vision Inspector</text>
  <text x="36" y="130" class="sans" font-size="16" fill="#A9B8CC">An inspection pipeline that keeps capture metadata and robot state explicit.</text>
  <text x="36" y="161" class="sans" font-size="14" fill="#F3F6FB">Semantic interpretation is optional; replay runs without a live model.</text>
  <text x="36" y="196" class="mono" font-size="12" fill="#8395AD">github.com/AmDeep/edge-vision-vllm-inspector</text>
  <circle class="pulse" cx="1044" cy="44" r="8" fill="#FFC857" opacity=".8"/>

</svg>
