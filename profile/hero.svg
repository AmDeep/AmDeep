<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Amardeep Singh — Applied AI engineer</title>
  <desc id="svg-description">A visual summary of applied AI work across retrieval, agent systems, inference, and robotics, with validation before action.</desc>
  <style>
    .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    .signal{opacity:.85}
    .pulse{opacity:.82}
    .card-accent{opacity:.9}
  </style>
  
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17283E"/>
      <stop offset="1" stop-color="#102A35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2B3B53" stroke-opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#wash)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="82" r="120" fill="#55D6BE" opacity=".06"/>
  <circle cx="1002" cy="258" r="150" fill="#82A8FF" opacity=".05"/>
  <text x="68" y="92" class="mono" font-size="15" fill="#55D6BE" letter-spacing="2">AMDEEP · TORONTO</text>
  <text x="68" y="158" class="sans" font-size="52" font-weight="750" fill="#F3F6FB">Amardeep Singh</text>
  <text x="70" y="202" class="sans" font-size="24" font-weight="650" fill="#F3F6FB">Applied AI engineer</text>
  <text x="70" y="238" class="sans" font-size="18" fill="#A9B8CC">Retrieval · agent systems · inference · robotics</text>
  <text x="70" y="280" class="sans" font-size="16" fill="#A9B8CC">Inspectable systems · explicit boundaries · reproducible evidence</text>
  <path d="M714 202H1098" stroke="#45617A" stroke-width="3" stroke-linecap="round"/>
  <path d="M744 202H1030" stroke="#55D6BE" stroke-width="2" stroke-dasharray="5 12" opacity=".7"/>
  <circle cx="742" cy="202" r="11" fill="#55D6BE" opacity=".18"/>
  <circle class="signal" cx="742" cy="202" r="6" fill="#55D6BE"/>
  <g class="sans" text-anchor="middle">
    <rect x="708" y="132" width="124" height="42" rx="12" fill="#172438" stroke="#2B3B53"/>
    <text x="770" y="158" font-size="14" fill="#F3F6FB">model output</text>
    <rect x="850" y="132" width="124" height="42" rx="12" fill="#172438" stroke="#2B3B53"/>
    <text x="912" y="158" font-size="14" fill="#F3F6FB">validation</text>
    <rect x="992" y="132" width="124" height="42" rx="12" fill="#172438" stroke="#2B3B53"/>
    <text x="1054" y="158" font-size="14" fill="#F3F6FB">bounded action</text>
  </g>
  <circle class="pulse" cx="770" cy="202" r="4" fill="#55D6BE"/>
  <circle class="pulse" cx="912" cy="202" r="4" fill="#82A8FF"/>
  <circle class="pulse" cx="1054" cy="202" r="4" fill="#FFB86B"/>
  <text x="912" y="248" class="mono" font-size="12" text-anchor="middle" fill="#A9B8CC">A recurring pattern in the selected projects</text>

</svg>
