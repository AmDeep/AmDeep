<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Amardeep Singh — applied AI, retrieval, and robotics</title>
  <desc id="d">Animated banner: plans from a model travel toward a robot. Plans within limits pass a validator; one outside limits is stopped and rejected.</desc>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,ui-monospace,monospace}
    .pk{opacity:0;animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
    .pass{fill:#5CC8C0;animation-name:pass}
    .rej{fill:#5CC8C0;animation-name:rej}
    .p1{animation-delay:0s}.p2{animation-delay:3s}.p3{animation-delay:6s}
    .gate{animation:flash 9s 3s infinite}
    .ln{opacity:0;animation:swap 12s infinite}
    .l2{animation-delay:3s}.l3{animation-delay:6s}.l4{animation-delay:9s}
    @keyframes swap{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-8px)}}
    @keyframes pass{0%{transform:translateX(0);opacity:0}4%{opacity:1}40%{transform:translateX(620px);opacity:1}46%,100%{transform:translateX(620px);opacity:0}}
    @keyframes rej{0%{transform:translate(0,0);opacity:0;fill:#5CC8C0}4%{opacity:1}22%{transform:translate(268px,0);opacity:1;fill:#5CC8C0}26%{fill:#FFB347}30%{transform:translate(268px,0);opacity:1;fill:#FFB347}42%,100%{transform:translate(250px,-52px);opacity:0;fill:#FFB347}}
    @keyframes flash{0%,20%{stroke:#8FA3B8;stroke-width:3}24%,32%{stroke:#FFB347;stroke-width:5}40%,100%{stroke:#8FA3B8;stroke-width:3}}
    @media (prefers-reduced-motion:reduce){
      .pk,.gate,.ln{animation:none}
      .pk{opacity:1}.l1{opacity:1}
      .p1{transform:translateX(620px)}.p2{transform:translate(250px,-52px);fill:#FFB347}.p3{transform:translateX(0)}}
  </style>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1F3044" stroke-width="1"/></pattern></defs>
  <rect width="1200" height="400" fill="#0E1621"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <text x="80" y="118" class="sans" font-size="64" font-weight="700" fill="#E8EEF4" letter-spacing="-1">Amardeep Singh</text>
  <text x="82" y="162" class="sans" font-size="26" fill="#B8C7D6">Applied AI, retrieval, and robotics · Toronto</text>
  <g class="mono" font-size="17" fill="#5CC8C0">
    <text class="ln l1" x="82" y="200">Agent workflows with evaluation built in</text>
    <text class="ln l2" x="82" y="200">Retrieval pipelines you can inspect</text>
    <text class="ln l3" x="82" y="200">ROS 2 systems with explicit safety boundaries</text>
    <text class="ln l4" x="82" y="200">From data to edge deployment</text>
  </g>
  <line x1="260" y1="300" x2="960" y2="300" stroke="#2C4058" stroke-width="2" stroke-dasharray="3 7"/>
  <rect x="80" y="268" width="180" height="64" rx="6" fill="#16263A" stroke="#2C4058"/>
  <text x="170" y="307" class="mono" font-size="16" fill="#E8EEF4" text-anchor="middle">model plan</text>
  <rect x="960" y="268" width="180" height="64" rx="6" fill="#16263A" stroke="#2C4058"/>
  <text x="1050" y="307" class="mono" font-size="16" fill="#E8EEF4" text-anchor="middle">robot</text>
  <line class="gate" x1="600" y1="246" x2="600" y2="354" stroke="#8FA3B8" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="380" class="mono" font-size="14" fill="#8FA3B8" text-anchor="middle">deterministic validator</text>
  <rect class="pk pass p1" x="280" y="292" width="40" height="16" rx="3"/>
  <rect class="pk rej p2" x="280" y="292" width="40" height="16" rx="3"/>
  <rect class="pk pass p3" x="280" y="292" width="40" height="16" rx="3"/>
  <rect x="860" y="96" width="14" height="14" rx="2" fill="#5CC8C0"/>
  <text x="884" y="108" class="sans" font-size="15" fill="#B8C7D6">within limits: executed</text>
  <rect x="860" y="124" width="14" height="14" rx="2" fill="#FFB347"/>
  <text x="884" y="136" class="sans" font-size="15" fill="#B8C7D6">outside limits: rejected</text>
</svg>
