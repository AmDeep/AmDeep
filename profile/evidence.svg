<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Project scope evidence</title>
  <desc id="svg-description">Documented project counts: 12 agent labs, 15 retrieval projects, and a 12-stage inference portfolio. These are repository scope counts, not deployment metrics.</desc>
  <style>
    .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    @media (prefers-reduced-motion: no-preference) {
      .signal{animation:signal-travel 5s ease-in-out infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .card-accent{animation:accent-shift 8s ease-in-out infinite}
    }
    @media (prefers-reduced-motion: reduce) {
      .signal,.pulse,.card-accent{animation:none!important}
    }
    @keyframes signal-travel{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(350px);opacity:1}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes accent-shift{0%,100%{opacity:.72}50%{opacity:1}}
  </style>
  
  <rect width="1200" height="270" rx="22" fill="#101826"/>
  <text x="56" y="38" class="sans" font-size="16" font-weight="700" fill="#F3F6FB">PROJECT SCOPE, NOT VANITY METRICS</text>
  
  <g>
    <rect x="56" y="64" width="344" height="152" rx="18" fill="#172438" stroke="#2B3B53"/>
    <rect class="card-accent" x="56" y="64" width="5" height="152" rx="3" fill="#55D6BE" style="animation-delay:0.0s"/>
    <text x="80" y="104" class="mono" font-size="12" fill="#A9B8CC" letter-spacing="1">AGENT LABS</text>
    <text x="80" y="166" class="sans" font-size="48" font-weight="750" fill="#F3F6FB">12</text>
    <text x="80" y="194" class="sans" font-size="14" fill="#A9B8CC">AIAgents</text>
  </g>
  <g>
    <rect x="424" y="64" width="344" height="152" rx="18" fill="#172438" stroke="#2B3B53"/>
    <rect class="card-accent" x="424" y="64" width="5" height="152" rx="3" fill="#55D6BE" style="animation-delay:0.8s"/>
    <text x="448" y="104" class="mono" font-size="12" fill="#A9B8CC" letter-spacing="1">RETRIEVAL PROJECTS</text>
    <text x="448" y="166" class="sans" font-size="48" font-weight="750" fill="#F3F6FB">15</text>
    <text x="448" y="194" class="sans" font-size="14" fill="#A9B8CC">RAGSystemLabs</text>
  </g>
  <g>
    <rect x="792" y="64" width="344" height="152" rx="18" fill="#172438" stroke="#2B3B53"/>
    <rect class="card-accent" x="792" y="64" width="5" height="152" rx="3" fill="#55D6BE" style="animation-delay:1.6s"/>
    <text x="816" y="104" class="mono" font-size="12" fill="#A9B8CC" letter-spacing="1">INFERENCE STAGES</text>
    <text x="816" y="166" class="sans" font-size="48" font-weight="750" fill="#F3F6FB">12</text>
    <text x="816" y="194" class="sans" font-size="14" fill="#A9B8CC">inference-serving-portfolio</text>
  </g>
  <text x="56" y="248" class="sans" font-size="12" fill="#A9B8CC">Counts describe the documented contents of these repositories, not deployment volume or user impact.</text>

</svg>
