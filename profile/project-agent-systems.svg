<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="svg-title svg-description">
  <title id="svg-title">Agent Systems Labs</title>
  <desc id="svg-description">12 independent Python labs. Runnable patterns for reliable agent systems, organized as independent packages. Evidence: Per-lab tests, architecture notes, and demo evidence.</desc>
  <style>
    .sans{font-family:Inter,'Segoe UI',Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,monospace}
    .signal{opacity:.85}
    .pulse{opacity:.82}
    .card-accent{opacity:.9}
  </style>
  
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172438"/><stop offset="1" stop-color="#101826"/></linearGradient></defs>
  <rect width="1100" height="220" rx="20" fill="url(#card)" stroke="#2B3B53"/>
  <rect x="0" y="0" width="7" height="220" rx="4" fill="#55D6BE"/>
  <text x="36" y="47" class="mono" font-size="13" fill="#55D6BE" letter-spacing="1">12 INDEPENDENT PYTHON LABS</text>
  <text x="36" y="91" class="sans" font-size="29" font-weight="720" fill="#F3F6FB">Agent Systems Labs</text>
  <text x="36" y="130" class="sans" font-size="16" fill="#A9B8CC">Runnable patterns for reliable agent systems, organized as independent packages.</text>
  <text x="36" y="161" class="sans" font-size="14" fill="#F3F6FB">Per-lab tests, architecture notes, and demo evidence.</text>
  <text x="36" y="196" class="mono" font-size="12" fill="#8395AD">github.com/AmDeep/AIAgents</text>
  <circle class="pulse" cx="1044" cy="44" r="8" fill="#55D6BE" opacity=".8"/>

</svg>
