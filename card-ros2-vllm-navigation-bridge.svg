<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-label="ros2-vllm-navigation-bridge">
<defs><clipPath id="c"><rect width="560" height="190" rx="10"/></clipPath><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5CC8C0" stop-opacity="0"/><stop offset=".5" stop-color="#5CC8C0"/><stop offset="1" stop-color="#5CC8C0" stop-opacity="0"/></linearGradient></defs>
<style>.sweep{animation:sweep 5s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-240px)}100%{transform:translateX(560px)}}@media (prefers-reduced-motion:reduce){.sweep{animation:none;transform:translateX(160px)}}</style>
<g clip-path="url(#c)"><rect width="560" height="190" fill="#16263A"/>
<rect class="sweep" x="0" y="0" width="240" height="3" fill="url(#g)"/></g>
<rect x=".5" y=".5" width="559" height="189" rx="10" fill="none" stroke="#2C4058"/>
<text x="28" y="48" font-size="22" font-weight="700" fill="#E8EEF4" style="font-family:'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif">ros2-vllm-navigation-bridge</text>
<text x="28" y="80" font-size="16" fill="#B8C7D6" style="font-family:'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif">A bounded navigation bridge with explicit ROS 2</text>
<text x="28" y="104" font-size="16" fill="#B8C7D6" style="font-family:'Segoe UI','Helvetica Neue',Arial,system-ui,sans-serif">contracts and local obstacle checks.</text>
<circle cx="34" cy="158" r="5" fill="#FFB347"/>
<text x="48" y="163" font-size="14" fill="#8FA3B8" style="font-family:'JetBrains Mono',Consolas,ui-monospace,monospace">n/a</text>
