name: Refresh public profile snapshot

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test SVG renderer
        run: python -m unittest discover -s tests

      - name: Collect public repository metrics
        id: public-stats
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const user = 'AmDeep';
            const allRepos = await github.paginate(
              github.rest.repos.listForUser,
              { username: user, per_page: 100, type: 'owner' }
            );
            const repos = allRepos.filter(repo => !repo.private && !repo.fork);
            const languageCounts = {};
            for (const repo of repos) {
              if (repo.language) {
                languageCounts[repo.language] = (languageCounts[repo.language] || 0) + 1;
              }
            }
            const languages = Object.entries(languageCounts)
              .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
              .slice(0, 5)
              .map(([name, count]) => ({ name, count }));
            core.setOutput('stats', JSON.stringify({
              repos: repos.length,
              stars: repos.reduce((sum, repo) => sum + repo.stargazers_count, 0),
              languageCount: Object.keys(languageCounts).length,
              languages,
              updated: new Date().toISOString().slice(0, 10)
            }));

      - name: Render snapshot
        env:
          PROFILE_STATS: ${{ steps.public-stats.outputs.stats }}
        run: python scripts/render_metrics.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg
          git diff --cached --quiet || git commit -m "chore: refresh public profile snapshot"
          git push
